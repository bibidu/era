name: CI and self-host smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Noto Serif SC (body Song font)
        run: bash scripts/ensure-noto-serif-sc.sh

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Smoke highlight utils
        run: npm run smoke:highlights

      - name: Smoke supabase highlight share
        # 自建站 HTTP；CI 海外出口走 80/3000
        env:
          SUPABASE_URL: http://39.106.179.17
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6ImVyYS1zZWxmaG9zdCIsImlhdCI6MTc4NTY3OTQ2NCwiZXhwIjoyMTAxMDM5NDY0fQ.EZAtzZ4yHkA8eB49KBQClsQqVdX9W4KF7FPeHsXhzjU
          ERA_PUBLIC_BASE: http://39.106.179.17/
        run: npm run smoke:supabase-highlight

      - name: Build (self-host root base)
        run: npm run verify:fonts
        env:
          ERA_BASE: /

      - name: Inject build version
        run: node scripts/inject-build-version.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Summary
        run: |
          echo "### 自建站前端" >> "$GITHUB_STEP_SUMMARY"
          echo "CI 已构建 \`dist\`。线上发布请在有 SSH 的环境执行 \`npm run deploy:swas\` → \`http://39.106.179.17/\`" >> "$GITHUB_STEP_SUMMARY"
