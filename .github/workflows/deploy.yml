name: Deploy to EdgeOne Makers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Smoke highlight utils
        run: npm run smoke:highlights

      - name: Smoke supabase highlight share
        run: npm run smoke:supabase-highlight

      - name: Build (EdgeOne root base)
        run: npm run verify:fonts
        env:
          ERA_BASE: /

      - name: Inject build version
        run: node scripts/inject-build-version.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Deploy to EdgeOne Makers
        id: deploy
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          NO_PROXY: '*'
        run: |
          set -euo pipefail
          unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY all_proxy || true
          OUT="$(npx --yes edgeone@latest makers deploy ./dist -n bibidu-era -e production -t "$EDGEONE_API_TOKEN" --json 2>&1)"
          echo "$OUT"
          URL="$(echo "$OUT" | perl -ne 'print "$1\n" if /"(?:url|domain|accessUrl|projectUrl)"\s*:\s*"(https?:[^"]+)"/' | tail -1)"
          if [ -z "$URL" ]; then
            URL="$(echo "$OUT" | grep -Eo 'https?://[a-zA-Z0-9._/-]+\.(edgeone\.app|pages\.edgeone\.ai|edgeone\.site|edgeone\.cool)[^[:space:]"<>]*' | tail -1 || true)"
          fi
          if [ -n "$URL" ]; then
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "### EdgeOne 前端链接（含 eo_token，大陆访问必需）" >> "$GITHUB_STEP_SUMMARY"
            echo "$URL" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> 预览链接约 3 小时有效；长期稳定访问请在 EdgeOne 控制台绑定自定义域名。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### EdgeOne 部署完成（未能自动解析 URL，请到控制台查看项目 bibidu-era）" >> "$GITHUB_STEP_SUMMARY"
          fi
