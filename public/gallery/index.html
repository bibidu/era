<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>图文下载 · 地理风水达人</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0e0b;
      --gold: #c9a96e;
      --gold-dim: #b5a07a;
      --text: #e8dfc8;
      --sub: #6b5e47;
      --card-bg: #1a1812;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Serif SC", "Source Han Serif CN", Georgia, serif;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      padding: 14px 18px 12px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-block { flex: 1; min-width: 0; }

    .badge {
      font-size: 10px;
      letter-spacing: .1em;
      color: var(--gold-dim);
      border: 1px solid #b5a07a44;
      padding: 2px 10px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .title-block h1 {
      font-size: clamp(13px, 3.5vw, 17px);
      font-weight: 600;
      line-height: 1.35;
      color: #f0e6cc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title-block h1 span { color: #e05a4a; }

    .btn-zip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #c9a96e, #a07840);
      color: #1a1509;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity .2s;
      letter-spacing: .03em;
    }
    .btn-zip:disabled { opacity: .55; cursor: not-allowed; }
    .btn-zip:not(:disabled):hover { opacity: .88; }

    /* ── Dots ── */
    .dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--sub);
      transition: background .25s, transform .25s;
      cursor: pointer;
    }
    .dot.active {
      background: var(--gold);
      transform: scale(1.3);
    }
    .page-label {
      font-size: 11px;
      color: var(--sub);
      margin-left: 6px;
    }

    /* ── Carousel ── */
    .carousel-wrap {
      /* height set by JS after measuring header */
      display: flex;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .carousel-wrap::-webkit-scrollbar { display: none; }

    .slide {
      flex: 0 0 100%;
      scroll-snap-align: start;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
    }

    /* ── Skeleton ── */
    .skeleton {
      position: absolute;
      border-radius: 10px;
      background: var(--card-bg);
      overflow: hidden;
    }
    .skeleton::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(255,255,255,.06) 40%,
        rgba(255,255,255,.1) 50%,
        rgba(255,255,255,.06) 60%,
        transparent 100%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Image ── */
    .slide img {
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      border-radius: 10px;
      display: none; /* shown after load */
      position: relative;
      z-index: 1;
    }

    /* ── Individual download overlay ── */
    .slide-dl {
      position: absolute;
      bottom: 20px; right: 20px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,0,0,.55);
      color: var(--gold);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(201,169,110,.3);
      backdrop-filter: blur(6px);
      text-decoration: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity .2s;
    }
    .slide:hover .slide-dl,
    .slide-dl:focus { opacity: 1; }

    /* ── Lightbox ── */
    .lb {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.93);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 12px;
      backdrop-filter: blur(8px);
    }
    .lb.open { display: flex; }
    .lb img {
      max-height: 94vh; max-width: 94vw;
      object-fit: contain;
      border-radius: 8px;
    }
    .lb-close {
      position: fixed; top: 16px; right: 18px;
      color: #fff; font-size: 30px;
      background: none; border: none; cursor: pointer; opacity: .7;
    }
    .lb-close:hover { opacity: 1; }
    .lb-nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.12); color: #fff;
      border: none; width: 42px; height: 42px;
      border-radius: 50%; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .lb-prev { left: 10px; }
    .lb-next { right: 10px; }

    /* ── Footer ── */
    .footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      text-align: center;
      font-size: 10px;
      color: #2e2820;
      padding: 6px;
      background: var(--bg);
      border-top: 1px solid #ffffff06;
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="header" id="header">
  <div class="header-top">
    <div class="title-block">
      <div class="badge">地理风水 · 阳宅篇</div>
      <h1 id="groupTitle">图文下载中心</h1>
    </div>
    <button class="btn-zip" id="btnZip">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span id="btnLabel">下载 ZIP</span>
    </button>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="dots" id="dots"></div>
    <span class="page-label" id="pageLabel"></span>
  </div>
</div>

<!-- Carousel -->
<div class="carousel-wrap" id="carousel"></div>

<!-- Lightbox -->
<div class="lb" id="lb">
  <button class="lb-close" id="lbClose">×</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <img id="lbImg" src="" alt="" />
  <button class="lb-nav lb-next" id="lbNext">›</button>
</div>

<div class="footer">Era 图文工具 · bibidu/era</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ── Data ─────────────────────────────────────────────
const DATES = [
  {
    date: '2026-07-28',
    title: '买房租房<span>选楼层</span>，99%的人都<span>选错</span>了（上篇）',
    images: ['graphic-page-01.png','graphic-page-02.png','graphic-page-03.png','graphic-page-04.png']
  }
];

const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// ── Build image list ──────────────────────────────────
const base = new URL('.', location.href).href;
const allImages = [];
DATES.forEach(g => {
  g.images.forEach(f => allImages.push({ src: `${base}${g.date}/${f}`, file: f }));
});

// Set title
document.getElementById('groupTitle').innerHTML = DATES[0].title;

// ── Layout: set carousel height ───────────────────────
const headerEl = document.getElementById('header');
const carouselEl = document.getElementById('carousel');
const footerH = 26;

function setCarouselHeight() {
  const hh = headerEl.getBoundingClientRect().height;
  carouselEl.style.height = `${window.innerHeight - hh - footerH}px`;
}
setCarouselHeight();
window.addEventListener('resize', setCarouselHeight);

// ── Build slides ──────────────────────────────────────
allImages.forEach(({ src, file }, i) => {
  const slide = document.createElement('div');
  slide.className = 'slide';

  // skeleton — sized to 9:16 within available area
  const skel = document.createElement('div');
  skel.className = 'skeleton';

  // img
  const img = document.createElement('img');
  img.alt = `第 ${i+1} 页`;
  img.loading = i === 0 ? 'eager' : 'lazy';

  // Position skeleton to match image area
  function sizeSkeleton() {
    const sh = carouselEl.clientHeight - 24;
    const sw = Math.min(sh * 9 / 16, carouselEl.clientWidth - 24);
    skel.style.width = sw + 'px';
    skel.style.height = (sw * 16 / 9) + 'px';
    skel.style.maxHeight = sh + 'px';
  }
  sizeSkeleton();
  window.addEventListener('resize', sizeSkeleton);

  img.addEventListener('load', () => {
    skel.style.display = 'none';
    img.style.display = 'block';
  });
  img.src = src;

  // individual download / share
  const dlBtn = document.createElement(isIOS ? 'button' : 'a');
  dlBtn.className = 'slide-dl';
  if (!isIOS) { dlBtn.href = src; dlBtn.download = file; }
  dlBtn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> ${isIOS ? '分享' : '下载'}`;
  if (isIOS) dlBtn.addEventListener('click', () => shareImage(src, file));

  // click img → lightbox
  img.addEventListener('click', () => openLb(i));

  slide.appendChild(skel);
  slide.appendChild(img);
  slide.appendChild(dlBtn);
  carouselEl.appendChild(slide);
});

// ── Dots + page label ─────────────────────────────────
const dotsEl = document.getElementById('dots');
const pageLabelEl = document.getElementById('pageLabel');
const dots = allImages.map((_, i) => {
  const d = document.createElement('div');
  d.className = 'dot' + (i === 0 ? ' active' : '');
  d.addEventListener('click', () => {
    carouselEl.scrollTo({ left: i * carouselEl.clientWidth, behavior: 'smooth' });
  });
  dotsEl.appendChild(d);
  return d;
});

function updateDots(idx) {
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  pageLabelEl.textContent = `${idx + 1} / ${allImages.length}`;
}
updateDots(0);

// Scroll → update dots
let scrollTimer;
carouselEl.addEventListener('scroll', () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(() => {
    const idx = Math.round(carouselEl.scrollLeft / carouselEl.clientWidth);
    updateDots(idx);
  }, 60);
});

// ── iOS Share ─────────────────────────────────────────
async function shareImage(src, filename) {
  try {
    const resp = await fetch(src);
    const blob = await resp.blob();
    const file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare?.({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
    } else {
      window.open(src, '_blank');
    }
  } catch { window.open(src, '_blank'); }
}

// ── ZIP download ──────────────────────────────────────
document.getElementById('btnZip').addEventListener('click', async () => {
  if (isIOS) {
    for (const { src, file } of allImages) await shareImage(src, file);
    return;
  }
  const btn = document.getElementById('btnZip');
  const lbl = document.getElementById('btnLabel');
  btn.disabled = true;
  lbl.textContent = '打包中…';
  try {
    const zip = new JSZip();
    await Promise.all(allImages.map(async ({ src, file }) => {
      const blob = await fetch(src).then(r => r.blob());
      zip.file(file, blob);
    }));
    const content = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = 'era-gallery.zip';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } finally {
    btn.disabled = false;
    lbl.textContent = '下载 ZIP';
  }
});

// ── Lightbox ──────────────────────────────────────────
let lbCurrent = 0;
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');

function openLb(i) {
  lbCurrent = i;
  lbImg.src = allImages[i].src;
  lb.classList.add('open');
}
function closeLb() { lb.classList.remove('open'); }
function navLb(d) {
  lbCurrent = (lbCurrent + d + allImages.length) % allImages.length;
  lbImg.src = allImages[lbCurrent].src;
}

document.getElementById('lbClose').addEventListener('click', closeLb);
document.getElementById('lbPrev').addEventListener('click', () => navLb(-1));
document.getElementById('lbNext').addEventListener('click', () => navLb(1));
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') navLb(-1);
  if (e.key === 'ArrowRight') navLb(1);
});
</script>
</body>
</html>
