<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>图文下载 · 地理风水达人</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f0e0b;
      color: #e8dfc8;
      font-family: "Noto Serif SC", "Source Han Serif CN", "STSong", Georgia, serif;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 48px 24px 32px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .header-badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #b5a07a;
      border: 1px solid #b5a07a55;
      padding: 4px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: clamp(16px, 4vw, 22px);
      font-weight: 600;
      color: #f0e6cc;
      margin-bottom: 6px;
    }
    .header p { font-size: 12px; color: #8a7d66; margin-bottom: 24px; }

    /* iOS tip banner */
    .ios-banner {
      display: none;
      background: #1e1a10;
      border: 1px solid #b5a07a44;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 12px;
      color: #c9a96e;
      margin-bottom: 20px;
      text-align: left;
      line-height: 1.6;
    }
    .ios-banner strong { color: #e8dfc8; }

    /* ── Batch button ── */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #c9a96e 0%, #a07840 100%);
      color: #1a1509;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      letter-spacing: .04em;
    }
    .btn-primary:hover { opacity: .9; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    /* ── Gallery wrapper ── */
    .gallery { max-width: 1100px; margin: 0 auto; padding: 40px 20px 60px; }

    /* ── Date group ── */
    .date-group { margin-bottom: 48px; }
    .date-label {
      font-size: 12px;
      letter-spacing: .1em;
      color: #6b5e47;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .date-label::after { content: ''; flex: 1; height: 1px; background: #ffffff12; }
    .date-meta { font-size: 11px; color: #3d3427; margin-left: 4px; }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }

    /* ── Card ── */
    .card {
      background: #1a1812;
      border: 1px solid #ffffff10;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color .2s, transform .2s;
    }
    .card:hover { border-color: #c9a96e44; transform: translateY(-3px); }

    .card-thumb {
      position: relative;
      background: #0d0c09;
      overflow: hidden;
      cursor: zoom-in;
    }
    .card-thumb img { width: 100%; display: block; transition: transform .3s; }
    .card-thumb:hover img { transform: scale(1.02); }

    .card-badge {
      position: absolute;
      top: 10px; left: 10px;
      background: rgba(0,0,0,.55);
      color: #d4b880;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(196,169,110,.25);
    }

    .card-footer {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-name { font-size: 11px; color: #5a5040; }

    .btn-dl {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #2a2519;
      color: #c9a96e;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #c9a96e33;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, border-color .2s;
    }
    .btn-dl:hover { background: #382e1c; border-color: #c9a96e77; }

    /* iOS share btn replaces download btn */
    .btn-share {
      display: none;
      align-items: center;
      gap: 5px;
      background: #1a2a1e;
      color: #7ec87e;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #7ec87e33;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s;
    }
    .btn-share:hover { background: #203225; }

    /* ── Lightbox ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(8px);
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-height: 92vh;
      max-width: 92vw;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 0 80px rgba(0,0,0,.8);
    }
    .lb-close {
      position: fixed;
      top: 18px; right: 20px;
      color: #fff; font-size: 32px;
      cursor: pointer; opacity: .7;
      background: none; border: none; line-height: 1;
    }
    .lb-close:hover { opacity: 1; }
    .lb-nav {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.12);
      color: #fff; border: none;
      font-size: 22px; width: 44px; height: 44px;
      border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .lb-nav:hover { background: rgba(255,255,255,.25); }
    .lb-prev { left: 12px; }
    .lb-next { right: 12px; }
    /* iOS lightbox save hint */
    .lb-ios-hint {
      display: none;
      position: fixed;
      bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.7);
      color: #c9a96e;
      font-size: 13px;
      padding: 8px 20px;
      border-radius: 999px;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 11px;
      color: #2e2820;
      border-top: 1px solid #ffffff08;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-badge">地理风水 · 阳宅篇</div>
  <h1>图文下载中心</h1>
  <p>Era 图文工具生成 · 按日期整理</p>

  <div class="ios-banner" id="iosBanner">
    <strong>📱 iPhone / iPad 用户：</strong><br>
    点击图片放大后，<strong>长按图片 → 存储到"照片"</strong> 即可保存到相册。<br>
    或点击右下角 <strong>「分享」</strong> 按钮，选择"存储图像"。
  </div>

  <button class="btn-primary" id="btnAll">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    <span id="btnAllLabel">批量下载全部图片</span>
  </button>
</div>

<div class="gallery" id="gallery"></div>

<!-- Lightbox -->
<div class="lightbox" id="lb">
  <button class="lb-close" id="lbClose">×</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <img id="lbImg" src="" alt="" />
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <div class="lb-ios-hint" id="lbIosHint">长按图片 → 存储到"照片"</div>
</div>

<div class="footer">Era 图文工具 · bibidu/era</div>

<script>
// ── Data ──────────────────────────────────────────────
const DATES = [
  {
    date: '2026-07-28',
    title: '买房租房选楼层，99%的人都选错了（上篇）',
    images: [
      'graphic-page-01.png',
      'graphic-page-02.png',
      'graphic-page-03.png',
      'graphic-page-04.png',
    ]
  }
];

// ── iOS Detection ─────────────────────────────────────
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const canShare = isIOS && typeof navigator.share === 'function';

if (isIOS) {
  document.getElementById('iosBanner').style.display = 'block';
  document.getElementById('lbIosHint').style.display = 'block';
  document.getElementById('btnAllLabel').textContent = canShare ? '逐张分享（存入相册）' : '查看全部图片';
}

// ── Build gallery ──────────────────────────────────────
const base = new URL('.', location.href).href;
const galleryEl = document.getElementById('gallery');
const allImages = []; // flat list for lightbox

DATES.forEach(group => {
  const section = document.createElement('div');
  section.className = 'date-group';

  const label = document.createElement('div');
  label.className = 'date-label';
  label.innerHTML = `${group.date} <span class="date-meta">${group.title}</span>`;
  section.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'grid';

  group.images.forEach((file, i) => {
    const src = `${base}${group.date}/${file}`;
    const globalIdx = allImages.length;
    allImages.push(src);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-thumb" data-idx="${globalIdx}">
        <img src="${src}" alt="第${i+1}页" loading="lazy" />
        <span class="card-badge">第 ${i+1} 页</span>
      </div>
      <div class="card-footer">
        <span class="card-name">${file}</span>
        ${isIOS
          ? `<button class="btn-share" data-src="${src}" data-file="${file}" style="display:inline-flex">
               <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
               分享
             </button>`
          : `<a class="btn-dl" href="${src}" download="${file}">
               <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
               下载
             </a>`
        }
      </div>`;
    grid.appendChild(card);
  });

  section.appendChild(grid);
  galleryEl.appendChild(section);
});

// ── iOS Share helper ──────────────────────────────────
async function shareImage(src, filename) {
  try {
    const resp = await fetch(src);
    const blob = await resp.blob();
    const file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
    } else {
      window.open(src, '_blank');
    }
  } catch (e) {
    window.open(src, '_blank');
  }
}

document.addEventListener('click', e => {
  const btn = e.target.closest('.btn-share');
  if (btn) shareImage(btn.dataset.src, btn.dataset.file);
});

// ── Lightbox ──────────────────────────────────────────
let current = 0;
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');

function openLb(idx) {
  current = idx;
  lbImg.src = allImages[idx];
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
function navLb(d) { current = (current + d + allImages.length) % allImages.length; lbImg.src = allImages[current]; }

document.getElementById('gallery').addEventListener('click', e => {
  const t = e.target.closest('[data-idx]');
  if (t) openLb(+t.dataset.idx);
});
document.getElementById('lbClose').addEventListener('click', closeLb);
document.getElementById('lbPrev').addEventListener('click', () => navLb(-1));
document.getElementById('lbNext').addEventListener('click', () => navLb(1));
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') navLb(-1);
  if (e.key === 'ArrowRight') navLb(1);
});

// ── Batch download / share ────────────────────────────
document.getElementById('btnAll').addEventListener('click', async () => {
  if (isIOS) {
    for (const img of allImages) {
      const filename = img.split('/').pop();
      await shareImage(img, filename);
    }
    return;
  }
  for (let i = 0; i < allImages.length; i++) {
    await new Promise(resolve => {
      const a = document.createElement('a');
      a.href = allImages[i];
      a.download = allImages[i].split('/').pop();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(resolve, 400);
    });
  }
});
</script>
</body>
</html>
