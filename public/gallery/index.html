<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图文库 Gallery</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a1a; color: #e0e0e0; font-family: "Noto Sans SC", sans-serif; }
  header { padding: 24px; background: #111; border-bottom: 1px solid #333; }
  header h1 { font-size: 1.4rem; font-weight: 600; color: #f0f0f0; }
  .groups { padding: 24px; max-width: 1400px; margin: 0 auto; }
  .group { margin-bottom: 40px; }
  .group-title { font-size: 0.85rem; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; }
  .thumb { position: relative; cursor: pointer; border-radius: 8px; overflow: hidden; background: #222; flex: 0 0 auto; }
  .thumb img { display: block; height: 200px; width: auto; object-fit: cover; transition: opacity 0.2s; }
  .thumb:hover img { opacity: 0.8; }
  .batch-dl { margin-top: 12px; }
  .btn { display: inline-block; padding: 8px 18px; background: #0EA5E9; color: #fff; border-radius: 6px; font-size: 0.85rem; cursor: pointer; border: none; text-decoration: none; }
  .btn:hover { background: #0284C7; }
  /* 灯箱 */
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; }
  #lightbox.show { display: flex; }
  #lb-img { max-height: 88vh; max-width: 88vw; border-radius: 8px; }
  #lb-nav { display: flex; gap: 24px; margin-top: 16px; }
  #lb-nav button { background: #333; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
  #lb-nav button:hover { background: #555; }
  #lb-close { position: fixed; top: 20px; right: 28px; background: none; border: none; color: #fff; font-size: 2rem; cursor: pointer; }
  #lb-caption { color: #aaa; font-size: 0.8rem; margin-top: 8px; }
</style>
</head>
<body>
<header><h1>📁 图文库 Gallery</h1></header>
<div class="groups">
<div class="group">
  <div class="group-title">2026-07-28</div>
  <div class="grid">
    <div class="thumb" onclick="openLb('2026-07-28/cover-free-llm.png')">
      <img src="2026-07-28/cover-free-llm.png" alt="cover-free-llm.png" loading="lazy">
    </div>
    <div class="thumb" onclick="openLb('2026-07-28/full-review-sheet.png')">
      <img src="2026-07-28/full-review-sheet.png" alt="full-review-sheet.png" loading="lazy">
    </div>
    <div class="thumb" onclick="openLb('2026-07-28/graphic-page-01.png')">
      <img src="2026-07-28/graphic-page-01.png" alt="graphic-page-01.png" loading="lazy">
    </div>
    <div class="thumb" onclick="openLb('2026-07-28/graphic-page-02.png')">
      <img src="2026-07-28/graphic-page-02.png" alt="graphic-page-02.png" loading="lazy">
    </div>
    <div class="thumb" onclick="openLb('2026-07-28/graphic-page-03.png')">
      <img src="2026-07-28/graphic-page-03.png" alt="graphic-page-03.png" loading="lazy">
    </div>
    <div class="thumb" onclick="openLb('2026-07-28/graphic-page-04.png')">
      <img src="2026-07-28/graphic-page-04.png" alt="graphic-page-04.png" loading="lazy">
    </div>
    <div class="thumb" onclick="openLb('2026-07-28/graphic-page-05.png')">
      <img src="2026-07-28/graphic-page-05.png" alt="graphic-page-05.png" loading="lazy">
    </div>
  </div>
  <div class="batch-dl">
    <button class="btn" onclick="batchDownload(["2026-07-28/cover-free-llm.png", "2026-07-28/full-review-sheet.png", "2026-07-28/graphic-page-01.png", "2026-07-28/graphic-page-02.png", "2026-07-28/graphic-page-03.png", "2026-07-28/graphic-page-04.png", "2026-07-28/graphic-page-05.png"])">下载全部 (7张)</button>
  </div>
</div>
</div>
<div id="lightbox">
  <button id="lb-close" onclick="closeLb()">×</button>
  <img id="lb-img" src="" alt="">
  <div id="lb-caption"></div>
  <div id="lb-nav">
    <button onclick="navLb(-1)">◀ 上一张</button>
    <button onclick="navLb(1)">下一张 ▶</button>
  </div>
</div>
<script>
var allImgs = [];
document.querySelectorAll('.thumb img').forEach(function(img){ allImgs.push(img.src); });
var current = 0;
function openLb(src){
  var lb = document.getElementById('lightbox');
  var lbImg = document.getElementById('lb-img');
  var base = location.href.replace(/\/[^\/]*$/, '/');
  var full = base + src;
  lbImg.src = full;
  current = allImgs.findIndex(function(s){ return s.includes(src.split('/').pop()); });
  document.getElementById('lb-caption').textContent = src.split('/').pop();
  lb.classList.add('show');
}
function closeLb(){ document.getElementById('lightbox').classList.remove('show'); }
function navLb(dir){ 
  current = (current + dir + allImgs.length) % allImgs.length;
  document.getElementById('lb-img').src = allImgs[current];
  document.getElementById('lb-caption').textContent = allImgs[current].split('/').pop();
}
document.addEventListener('keydown', function(e){ 
  if(e.key==='Escape') closeLb(); 
  if(e.key==='ArrowLeft') navLb(-1);
  if(e.key==='ArrowRight') navLb(1);
});
var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
function batchDownload(imgs){
  if(isIOS){
    alert('iOS 用户：请逐张长按图片保存到相册');
    return;
  }
  var base = location.href.replace(/\/[^\/]*$/, '/');
  imgs.forEach(function(src, i){
    setTimeout(function(){
      var a = document.createElement('a');
      a.href = base + src;
      a.download = src.split('/').pop();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }, i * 300);
  });
}
</script>
</body>
</html>
