<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0a0a0a" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('era-theme')
          if (theme !== 'light' && theme !== 'dark') theme = 'dark'
          var color = theme === 'light' ? '#ffffff' : '#0a0a0a'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.documentElement.style.backgroundColor = color
          document.documentElement.style.setProperty('--era-header', color)
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (node) {
            node.setAttribute('content', color)
          })
          var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          if (statusBar) statusBar.setAttribute('content', 'black-translucent')
          // Safari 26+ samples first-paint edge/body color; bake tint before React mounts.
          var boot = document.createElement('style')
          boot.setAttribute('data-era-theme-boot', '1')
          boot.textContent =
            'html,body,#root{background:' + color + '!important;}' +
            '#era-safari-tint{background:' + color + '!important;}'
          document.head.appendChild(boot)
          document.addEventListener('DOMContentLoaded', function () {
            document.body.style.backgroundColor = color
          })
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet" />
    <title>海报编辑器</title>
    <script type="module" crossorigin src="/era/assets/index-B6QdfGQI.js"></script>
    <link rel="stylesheet" crossorigin href="/era/assets/index-B1GbJ91o.css">
  </head>
  <body>
    <div id="root">
      <div
        style="
          display: flex;
          min-height: 100dvh;
          align-items: center;
          justify-content: center;
          background: #0a0a0a;
          color: #a3a3a3;
          font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        "
      >
        加载中...
      </div>
    </div>
    <script>
      ;(function () {
        var assetReloadKey = 'era-asset-reload'

        function showLoadFailure() {
          var root = document.getElementById('root')
          if (!root || window.__ERA_APP_MOUNTED__) return
          root.innerHTML =
            '<div style="display:flex;min-height:100dvh;align-items:center;justify-content:center;padding:24px;text-align:center;color:#525252;font:14px/1.5 system-ui,-apple-system,\'Segoe UI\',sans-serif">页面加载失败，请下拉刷新或清除浏览器缓存后重试</div>'
        }

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            if (!target || (target.tagName !== 'SCRIPT' && target.tagName !== 'LINK')) return
            if (sessionStorage.getItem(assetReloadKey)) {
              showLoadFailure()
              return
            }
            sessionStorage.setItem(assetReloadKey, '1')
            var url = new URL(window.location.href)
            url.searchParams.set('era_refresh', Date.now().toString(36))
            window.location.replace(url.toString())
          },
          true,
        )
      })()
    </script>
  </body>
</html>
